<!-- Buton de instalare TekiDeki (Apache-2.0). Sursa: studio/unelte/install-app/ - acelasi bloc în toate uneltele. -->
<style>
/* App-scoped install controls. Uses each app's existing theme; no external assets. */
#td-install-section{box-sizing:border-box;width:100%;max-width:1160px;flex-shrink:0;text-align:center;margin:24px auto 16px;padding:0 16px;color:var(--text,var(--text-color,#17233b))}
#td-install-section[hidden],#td-install-dialog [hidden]{display:none!important}
#td-install-button,#td-install-close{box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:9px;width:auto;max-width:100%;min-height:46px;padding:11px 20px;border:1px solid var(--border,var(--border-color,#aab6c6));border-radius:12px;background:var(--card,var(--card-bg,var(--bg-2,#fff)));color:var(--text,var(--text-color,#17233b));font:600 14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:normal;cursor:pointer;text-transform:none;white-space:normal;overflow-wrap:anywhere;box-shadow:0 2px 8px #0000000a;touch-action:manipulation}
#td-install-button:hover,#td-install-close:hover{box-shadow:0 3px 14px #00000020}
#td-install-button:focus-visible,#td-install-close:focus-visible{outline:3px solid currentColor;outline-offset:4px}
#td-install-button:disabled{opacity:.65;cursor:wait}
#td-install-button svg{flex:0 0 20px;width:20px;height:20px}
#td-install-status{font:400 13px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:inherit;max-width:600px;margin:10px auto 0;overflow-wrap:anywhere}
#td-install-status:empty{display:none}
#td-install-dialog{box-sizing:border-box;position:fixed;inset:0;width:480px;max-width:calc(100vw - 32px);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);margin:auto;padding:24px;border:1px solid var(--border,var(--border-color,#aab6c6));border-radius:18px;background:var(--card,var(--card-bg,var(--bg-2,#fff)));color:var(--text,var(--text-color,#17233b));box-shadow:0 16px 64px #00000050;text-align:left;font:400 14px/1.65 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:auto;overflow-wrap:anywhere}
#td-install-dialog::backdrop{background:#0009}
#td-install-title{font:700 21px/1.3 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:inherit;margin:0 0 14px;letter-spacing:normal}
#td-install-dialog p{font:inherit;color:inherit;margin:0 0 14px}
#td-install-secure{font-weight:650!important}
#td-install-close{margin-top:4px}
@media(prefers-reduced-motion:reduce){#td-install-button,#td-install-close{transition:none!important}}
</style>
<section id="td-install-section" aria-label="App installation">
  <button type="button" id="td-install-button" aria-haspopup="dialog" aria-controls="td-install-dialog"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg><span id="td-install-label">Install app</span></button>
  <p id="td-install-status" role="status" aria-live="polite"></p>
</section>
<dialog id="td-install-dialog" aria-labelledby="td-install-title" aria-describedby="td-install-intro">
  <h2 id="td-install-title">Install this app</h2>
  <p id="td-install-intro"></p>
  <p id="td-install-secure" hidden></p>
  <p id="td-install-ios"></p>
  <p id="td-install-android"></p>
  <p id="td-install-desktop"></p>
  <p id="td-install-note"></p>
  <button type="button" id="td-install-close" autofocus>Close</button>
</dialog>
<script>/* SPDX-License-Identifier: Apache-2.0
 * Copyright 2026 Kristian Mario Mišković (TekiDeki).
 * Optional native installation and honest browser-specific fallback. No storage or network calls. */
(function () {
  'use strict';
  const translations = {
    en: {
      install:'Install app',title:'Install this app',close:'Close',
      intro:'Install a web app or shortcut using your browser. Available options depend on the device and browser.',
      ios:'iPhone / iPad: open this page in Safari. Tap Share → Add to Home Screen → Add. Enable “Open as Web App” if that option is shown.',
      android:'Android: open the browser menu (⋮), then choose Install app or Add to Home screen, if available.',
      desktop:'Desktop: use the install icon in the address bar or an Install this site as an app option in your browser menu, if available.',
      note:'If no installation option is available, try a compatible browser such as Chrome or Edge, or save a bookmark. A browser tab cannot always detect an existing installation; you may already find the app in your launcher. This button cannot force installation.',
      secure:'Installation needs HTTPS or localhost. Open the public HTTPS app instead of a downloaded file or an insecure HTTP address.',
      error:'The native installation dialog could not be opened. You can use these browser steps instead.',
      accepted:'Continue in your browser to finish installation.',dismissed:'Installation was not confirmed. You can try again later or use the browser menu.'
    },
    ro: {
      install:'Instalează aplicația',title:'Instalează această aplicație',close:'Închide',
      intro:'Instalează o aplicație web sau o scurtătură din browser. Opțiunile disponibile depind de dispozitiv și browser.',
      ios:'iPhone / iPad: deschide pagina în Safari. Apasă Partajare → Adăugați pe ecranul principal → Adăugați. Activează „Deschideți ca aplicație web” dacă apare această opțiune.',
      android:'Android: deschide meniul browserului (⋮), apoi alege Instalează aplicația sau Adaugă pe ecranul de pornire, dacă opțiunea există.',
      desktop:'Calculator: folosește pictograma de instalare din bara de adrese sau opțiunea Instalează acest site ca aplicație din meniul browserului, dacă este disponibilă.',
      note:'Dacă nu există opțiune de instalare, încearcă un browser compatibil, precum Chrome sau Edge, ori salvează un semn de carte. O filă de browser nu poate detecta mereu o instalare existentă; aplicația poate fi deja în lista ta de aplicații. Butonul nu poate forța instalarea.',
      secure:'Instalarea necesită HTTPS sau localhost. Deschide aplicația publică HTTPS, nu un fișier descărcat sau o adresă HTTP nesigură.',
      error:'Dialogul nativ de instalare nu a putut fi deschis. Poți urma pașii browserului de mai jos.',
      accepted:'Continuă în browser pentru a finaliza instalarea.',dismissed:'Instalarea nu a fost confirmată. Poți încerca mai târziu sau din meniul browserului.'
    },
    'sr-latn': {
      install:'Instaliraj aplikaciju',title:'Instaliraj ovu aplikaciju',close:'Zatvori',
      intro:'Instalirajte veb-aplikaciju ili prečicu preko pregledača. Dostupne opcije zavise od uređaja i pregledača.',
      ios:'iPhone / iPad: otvorite stranicu u Safari pregledaču. Izaberite Deli → Dodaj na početni ekran → Dodaj. Uključite „Otvori kao veb-aplikaciju” ako je ponuđeno.',
      android:'Android: otvorite meni pregledača (⋮), zatim izaberite Instaliraj aplikaciju ili Dodaj na početni ekran, ako je dostupno.',
      desktop:'Računar: koristite ikonu za instaliranje u adresnoj traci ili opciju Instaliraj ovaj sajt kao aplikaciju u meniju pregledača, ako postoji.',
      note:'Ako nema opcije za instaliranje, pokušajte kompatibilan pregledač poput Chrome-a ili Edge-a, ili sačuvajte obeleživač. Kartica pregledača ne može uvek da prepozna postojeću instalaciju; aplikacija je možda već na vašoj listi aplikacija. Ovo dugme ne može da nametne instalaciju.',
      secure:'Instalacija zahteva HTTPS ili localhost. Otvorite javnu HTTPS aplikaciju, a ne preuzetu datoteku ili nebezbednu HTTP adresu.',
      error:'Izvorni dijalog za instalaciju nije mogao da se otvori. Umesto toga pratite ove korake u pregledaču.',
      accepted:'Nastavite u pregledaču da završite instalaciju.',dismissed:'Instalacija nije potvrđena. Pokušajte kasnije ili preko menija pregledača.'
    },
    'sr-cyrl': {
      install:'Инсталирај апликацију',title:'Инсталирај ову апликацију',close:'Затвори',
      intro:'Инсталирајте веб-апликацију или пречицу преко прегледача. Доступне опције зависе од уређаја и прегледача.',
      ios:'iPhone / iPad: отворите страницу у Safari прегледачу. Изаберите Дели → Додај на почетни екран → Додај. Укључите „Отвори као веб-апликацију” ако је понуђено.',
      android:'Android: отворите мени прегледача (⋮), затим изаберите Инсталирај апликацију или Додај на почетни екран, ако је доступно.',
      desktop:'Рачунар: користите икону за инсталирање у адресној траци или опцију Инсталирај овај сајт као апликацију у менију прегледача, ако постоји.',
      note:'Ако нема опције за инсталирање, покушајте компатибилан прегледач попут Chrome-а или Edge-а, или сачувајте обележивач. Картица прегледача не може увек да препозна постојећу инсталацију; апликација је можда већ на вашој листи апликација. Ово дугме не може да наметне инсталацију.',
      secure:'Инсталација захтева HTTPS или localhost. Отворите јавну HTTPS апликацију, а не преузету датотеку или небезбедну HTTP адресу.',
      error:'Изворни дијалог за инсталацију није могао да се отвори. Уместо тога пратите ове кораке у прегледачу.',
      accepted:'Наставите у прегледачу да завршите инсталацију.',dismissed:'Инсталација није потврђена. Покушајте касније или преко менија прегледача.'
    }
  };
  const section=document.getElementById('td-install-section');
  const button=document.getElementById('td-install-button');
  const dialog=document.getElementById('td-install-dialog');
  const status=document.getElementById('td-install-status');
  const close=document.getElementById('td-install-close');
  const standalone=matchMedia('(display-mode: standalone)');
  const minimal=matchMedia('(display-mode: minimal-ui)');
  const overlay=matchMedia('(display-mode: window-controls-overlay)');
  let installed=false, pending=null, busy=false, error=false, statusKey=null;
  function t(){
    const lang=(document.documentElement.lang||'en').toLowerCase();
    const key=lang.startsWith('sr')?(lang.includes('cyrl')?'sr-cyrl':'sr-latn'):lang.split('-')[0];
    return Object.hasOwn(translations,key)?translations[key]:translations.en;
  }
  function isInstalled(){return installed||standalone.matches||minimal.matches||overlay.matches||navigator.standalone===true;}
  function refresh(){
    const text=t();section.hidden=isInstalled();
    section.setAttribute('aria-label',text.title);
    document.getElementById('td-install-label').textContent=text.install;
    document.getElementById('td-install-title').textContent=text.title;
    document.getElementById('td-install-intro').textContent=error?text.error:text.intro;
    for(const key of ['ios','android','desktop','note','secure'])document.getElementById('td-install-'+key).textContent=text[key];
    document.getElementById('td-install-secure').hidden=isSecureContext&&location.protocol!=='file:';
    close.textContent=text.close;status.textContent=statusKey?text[statusKey]:'';
    if(isInstalled()&&dialog.open)dialog.close();
  }
  function help(failed=false){
    error=failed;refresh();
    if(typeof dialog.showModal==='function'){if(!dialog.open)dialog.showModal();}
    else {const text=t();alert([failed?text.error:text.intro,...(!isSecureContext||location.protocol==='file:'?[text.secure]:[]),text.ios,text.android,text.desktop,text.note].join('\n\n'));}
  }
  window.addEventListener('beforeinstallprompt',event=>{
    if(isInstalled())return;event.preventDefault();pending=event;refresh();
  });
  button.addEventListener('click',async()=>{
    if(busy||isInstalled())return;
    if(!pending||!isSecureContext||location.protocol==='file:'){help();return;}
    const prompt=pending;pending=null;busy=true;button.disabled=true;statusKey=null;refresh();
    try{
      await prompt.prompt();
      const choice=await prompt.userChoice;
      if(!isInstalled())statusKey=choice?.outcome==='accepted'?'accepted':'dismissed';
    }catch(_){help(true);}
    finally{busy=false;button.disabled=false;refresh();}
  });
  close.addEventListener('click',()=>dialog.close());
  window.addEventListener('appinstalled',()=>{installed=true;pending=null;statusKey=null;refresh();});
  for(const query of [standalone,minimal,overlay]){
    if(query.addEventListener)query.addEventListener('change',refresh);
    else if(query.addListener)query.addListener(refresh);
  }
  refresh();
  new MutationObserver(refresh).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
})();
</script>
